<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Điện Máy Hiếu - Zalo Mini App</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #0f172a; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
    .loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #0f172a; color: #38bdf8; font-family: Inter, sans-serif; z-index: 10; transition: opacity 0.3s; }
    .loading.hidden { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div class="loading" id="loader">
    <div>
      <div style="text-align:center; font-size:24px; font-weight:900;">Điện Máy Hiếu</div>
      <div style="text-align:center; font-size:13px; margin-top:8px; color:#94a3b8;">Đang tải...</div>
    </div>
  </div>
  <iframe id="appFrame" src="https://dienmayhieu.com/" allow="geolocation; microphone; camera" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-downloads"></iframe>
  <script>
    (function(){
      var loader = document.getElementById('loader');
      var frame = document.getElementById('appFrame');
      frame.addEventListener('load', function(){ loader.classList.add('hidden'); });
      setTimeout(function(){ loader.classList.add('hidden'); }, 3000);
    })();
  </script>
</body>
</html>
