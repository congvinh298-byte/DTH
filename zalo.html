<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Điện Máy Hiếu - Zalo Mini App</title>
  <style>
    body, html { 
      margin: 0; 
      padding: 0; 
      height: 100%; 
      overflow: hidden; 
      background-color: #0f172a;
    }
    iframe { 
      width: 100%; 
      height: 100%; 
      border: none; 
      display: block;
    }
  </style>
</head>
<body>
  <!-- Iframe nhúng trực tiếp bản Web của Điện Máy Hiếu vào Mini App -->
  <!-- Đây là giải pháp SSOT (Single Source of Truth) tuyệt đối -->
  <iframe src="https://dienmayhieu.com/index.php" allow="geolocation; microphone; camera"></iframe>
</body>
</html>
